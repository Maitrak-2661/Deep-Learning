<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachable Machine Pose Model — Posture Classifier</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; text-align: center; }
  h2 { margin-bottom: 4px; }
  p.sub { color: #555; margin-top: 0; }
  button { font-size: 16px; padding: 10px 28px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:disabled { background: #999; cursor: default; }
  #canvas { margin-top: 16px; border-radius: 8px; border: 2px solid #ccc; background: #000; }
  #label-container { width: 320px; margin: 16px auto; text-align: left; }
  .row { margin: 6px 0; padding: 8px 10px; border-radius: 6px; background: #fff; border: 1px solid #ddd; font-size: 15px; }
  .row.top { background: #e6f4ea; border-color: #34a853; font-weight: bold; }
  #result { font-size: 22px; font-weight: bold; margin-top: 12px; color: #1a73e8; }
</style>
</head>
<body>
<h2>Teachable Machine Pose Model</h2>
<p class="sub">Posture classifier: bending · lying · sitting · standing</p>
<button type="button" id="startBtn" onclick="init()">Start</button>
<div id="result"></div>
<div><canvas id="canvas"></canvas></div>
<div id="label-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
<script type="text/javascript">
    // Model files (model.json, metadata.json, weights.bin) live in ./my_model/
    // Run with:  python -m http.server 8000   then open http://localhost:8000
    const URL = "./models/pose/";
    let model, webcam, ctx, labelContainer, maxPredictions;

    async function init() {
        document.getElementById("startBtn").disabled = true;
        document.getElementById("startBtn").innerText = "Loading...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const size = 400;
        const flip = true;
        webcam = new tmPose.Webcam(size, size, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        const canvas = document.getElementById("canvas");
        canvas.width = size; canvas.height = size;
        ctx = canvas.getContext("2d");
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) {
            const div = document.createElement("div");
            div.className = "row";
            labelContainer.appendChild(div);
        }
        document.getElementById("startBtn").innerText = "Running";
    }

    async function loop(timestamp) {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        // Prediction 1: run the frame through PoseNet
        const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
        // Prediction 2: run PoseNet output through our Teachable Machine classifier
        const prediction = await model.predict(posenetOutput);

        let best = 0;
        for (let i = 1; i < maxPredictions; i++) {
            if (prediction[i].probability > prediction[best].probability) best = i;
        }
        for (let i = 0; i < maxPredictions; i++) {
            const row = labelContainer.childNodes[i];
            row.innerHTML = prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            row.className = (i === best) ? "row top" : "row";
        }
        document.getElementById("result").innerText =
            prediction[best].className + " (" + (prediction[best].probability * 100).toFixed(0) + "%)";

        drawPose(pose);
    }

    function drawPose(pose) {
        if (webcam.canvas) {
            ctx.drawImage(webcam.canvas, 0, 0);
            if (pose) {
                const minPartConfidence = 0.5;
                tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
            }
        }
    }
</script>
</body>
</html>
